<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/shield.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="description" content="Empower Safety - Autonomous AI Threat Detection & Offline Women Safety Platform" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/shield.svg" />
    <title>Empower Safety | Offline AI Women Safety Platform</title>
  </head>
  <body class="bg-slate-950 text-slate-100 overflow-x-hidden selection:bg-rose-500 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Register Service Worker for 100% offline functionality
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then(
            (reg) => console.log('Empower Safety SW registered:', reg.scope),
            (err) => console.log('Empower Safety SW registration failed:', err)
          );
        });
      }
    </script>
  </body>
</html>
